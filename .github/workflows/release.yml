name: Native release
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
    tags:
      - 'v18.8.5-zh.*'
  workflow_dispatch:
    inputs:
      mode:
        description: 'build: compile only; verify: test the already published VERSION'
        type: choice
        options:
          - build
          - verify
        default: build
permissions:
  contents: read
concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'build')
    strategy:
      fail-fast: false
      matrix: &hosts
        include:
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
          - runner: windows-latest
            target: windows-x64
          - runner: windows-11-arm
            target: windows-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Validate actual host and release metadata
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ github.ref_name }}
          TAG_BUILD: ${{ github.event_name == 'push' }}
        run: |
          test "$(bun scripts/release-tools.ts host)" = "$EXPECTED_TARGET"
          if [[ $TAG_BUILD == true ]]; then test "$(cat VERSION)" = "$RELEASE_TAG"; fi
      - name: Build and isolated native smoke
        run: bash build.sh
      - name: Package verified host binary
        run: bash package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/omp-zh-${{ matrix.target }}.*
            dist/SHA256SUMS-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Validate complete target set and aggregate checksums
        run: bun scripts/release-tools.ts aggregate release-assets
      - name: Publish all assets together
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "$RELEASE_TAG"
          # A failed upload leaves a draft, never a partial public release.
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes "中文本地化包；五种原生主机产物及统一 SHA256SUMS。上游版本与提交见包内元数据。" \
            release-assets/omp-zh-linux-x64.tar.gz \
            release-assets/omp-zh-darwin-x64.tar.gz \
            release-assets/omp-zh-darwin-arm64.tar.gz \
            release-assets/omp-zh-windows-x64.zip \
            release-assets/omp-zh-windows-arm64.zip \
            release-assets/SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false
  verify-public-install:
    needs: publish
    if: ${{ always() && !cancelled() && (needs.publish.result == 'success' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'verify')) }}
    strategy:
      fail-fast: false
      matrix: *hosts
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      OMP_ZH_SOURCE_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Select the published package version
        shell: bash
        run: echo "OMP_ZH_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
      - name: Confirm actual verification host
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: test "$(bun scripts/release-tools.ts host)" = "$EXPECTED_TARGET"
      - name: Verify public Unix installer and recovery
        if: runner.os != 'Windows'
        shell: bash
        run: bun scripts/verify-release.ts
      - name: Verify public Windows PowerShell 5.1 installer and recovery
        if: runner.os == 'Windows'
        shell: powershell
        run: '& ./.github/scripts/verify-windows-install.ps1'
      - name: Verify public PowerShell 7 installer and recovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& ./.github/scripts/verify-windows-install.ps1'
